[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "nodejs_22"
]
[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]
[phases.build]
cmds = [
  "corepack enable",
  "npm install",
  "npm rebuild",
  "npm run build"
]
[start]
cmd = "php -d upload_max_filesize=20M -d post_max_size=25M artisan config:clear && php artisan route:clear && php artisan view:clear && php artisan cache:clear && php artisan migrate --force && php artisan storage:link --force && php artisan serve --host=0.0.0.0 --port=$PORT"
