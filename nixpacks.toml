[phases.setup]
nixPkgs = [
  "php84",
  "php84Packages.composer",
  "nodejs_22"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
cmds = [
  "corepack enable",
  "npm install",
  "npm rebuild",
  "npm run build"
]

[phases.deploy]
cmds = [
  "php artisan storage:link --force",
  "php artisan migrate --force"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
